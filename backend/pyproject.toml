[project]
name = "tessera"
version = "0.1.0"
description = "Tessera: modular pipeline from store signals to decisions (FastwebAI Hackathon 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tessera = "tessera.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files in different folders may share a basename (no __init__.py needed).
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
