      function inPoly(x, y, poly) {
        let c = false;

          const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
          if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
        }
        return c;
      }
      // Fibonacci sphere, land only (plus Antarctica band).
      const PTS = [];
      const N = 42000, GA = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2;
        const lat = Math.asin(y) * 180 / Math.PI;
        let lon = ((i * GA) * 180 / Math.PI) % 360; if (lon > 180) lon -= 360;
        let land = lat < -70;
        for (let k = 0; !land && k < LAND.length; k++) land = inPoly(lon, lat, LAND[k]);
        if (land) PTS.push([lat * Math.PI / 180, lon]);
      }
      const D2R = Math.PI / 180;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const eo = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const eio = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      const lineLon = (t) => 152 - t * 24;
      const fireAt = (lon) => (152 - lon) / 24;
      const nEl = document.getElementById("s1-n");

      function draw(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0A0C11"; ctx.fillRect(0, 0, 1920, 1080);
        const zoom = 1 + 5 * Math.pow(clamp((t - 6.6) / 0.8, 0, 1), 3);
        const L = lineLon(t), lon0 = L - 24, lat0 = 24 * D2R;
        const sl0 = Math.sin(lat0), cl0 = Math.cos(lat0);

        const pd = (2.32 - lon0) * D2R, pl = 48.87 * D2R;
        const pxo = 470 * Math.cos(pl) * Math.sin(pd), pyo = -470 * (cl0 * Math.sin(pl) - sl0 * Math.cos(pl) * Math.cos(pd));
        const zu = eio((t - 6.6) / 0.8);
        const tx = (1210 + pxo) * (1 - zu) + 960 * zu, ty = (560 + pyo) * (1 - zu) + 540 * zu;
        const cx = tx - pxo * zoom, cy = ty - pyo * zoom, R = 470 * zoom;
        const proj = (latR, lon) => {
          const d = (lon - lon0) * D2R, cl = Math.cos(latR), sl = Math.sin(latR);
          return [cx + R * cl * Math.sin(d), cy - R * (cl0 * sl - sl0 * cl * Math.cos(d)), sl0 * sl + cl0 * cl * Math.cos(d)];
        };
        // planet body
        const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);

        }

        ctx.beginPath(); let started = false; let top = null;
        for (let la = -62; la <= 78; la += 2) {
          const q = proj(la * D2R, L);
          if (q[2] <= 0) { started = false; continue; }
          if (!started) { ctx.moveTo(q[0], q[1]); started = true; } else ctx.lineTo(q[0], q[1]);

        for (const s of STORES) {

          const q = proj(s[1] * D2R, s[2]);
          const has = t >= tf;

          if (q[2] > 0.05) {

              ctx.fillStyle = "#F2B544"; ctx.beginPath(); ctx.arc(q[0], q[1], 4.5 * Math.min(zoom, 2), 0, Math.PI * 2); ctx.fill();

            const mx = (q[0] + inbox[0] + 200) / 2, my = Math.min(q[1], inbox[1]) - 260;
