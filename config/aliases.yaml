# config/aliases.yaml: how store staff name products and colours, beyond the catalog names.
# Owner: lane A (DATA-02). Consumer: int.link (INT-01) via style/colour alias maps.
#
# Provenance rule (RFC §5.1): every alias was seen in a closing email of a DEV store
# (config/eval_split.yaml), outside quoted reply lines. `source` is the first such file,
# relative to generated/sources/. Nothing here comes from generator/, ground_truth/ or
# hold-out / unassigned stores. Catalog names (style_name, color_name_it/en) are NOT
# repeated: the linker already reads them from erp/master_data/.
#
# `lang` is the language of the store the source email comes from (stores.csv), not
# necessarily the language of the word (staff mix English names into every language).
#
# Sections:
#   styles:  style_code -> aliases that name exactly one style.
#   shared:  aliases that name several styles. The linker must keep them ambiguous
#            unless colour/size/context narrows the set; never pick one silently.
#   colours: colour_code -> aliases. A word may map to several codes when no style
#            carries both (white words -> 001 and 20D): the style's colour run decides.
#
# Not aliased on purpose: generic category words (piumino, doudoune, Daunenjacke,
# 숏패딩, ダウン, 短款/长款...) and bare "oversize" (also a fit adjective) name too many
# styles; leave them to descriptive matching.
# Freeze this file before hold-out metrics (RFC §7.1).

