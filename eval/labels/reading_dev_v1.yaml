# EVL-02 reading labels, version 1. Eval only: written from the dev sample emails and the
# answer keys (generated/ground_truth/answer_keys/emails/*). The product never reads this file.
#
# Written by hand on 2026-10-23, before any product run on the sample, from the canonical text
# of each email (tessera email parser). One label = one business fact the email states.
#
#   anchor    exact substring of the canonical document text, unique in it; a prediction matches
#             when its evidence span overlaps the anchor and its kind is in `kinds`.
#   kinds     acceptable Observation kinds (the taxonomy of the extraction prompt).
#   required  true: core signal, counted in recall. false: a valid but minor fact (single product
#             sell lines, traffic counts, greetings-level remarks). Extracting it is not a false
#             positive, missing it is not a false negative.
#   product   catalog target the store means (style code, SKU or SKU-size), or absent when the
#             fact names no product. The answer keys decide misnamed products ("粉紅 Bady" at
#             HKG01 was ILVARO pink).
#   level     "style": the email's product cannot be resolved below style (colour not in the
#             catalog, or no colour); any SKU-level link is then an error.
#   negated   true when the correct reading is that the fact did not happen.
#
# Correction after the first scoring (2026-10-23), a catalog error, not tuning: the three
# "tricot ... black" labels (LON01 09-20, SYD01 10-08, SEL01 10-08) said TRICOT PADDED CARDIGAN
# had no black colour and expected style-only links. sku_colour.csv lists I10919B00042-999, so
# they now expect the black SKU-size. No other label was changed after seeing predictions.
#
# Files with no labels are part of the sample: any observation extracted there is a false
# positive (wrong-list mails, HQ questions, attachment-only mails).

version: 1
sample:
  split: dev
  criterion: >-
    Every .eml file of the 12 dev stores (config/eval_split.yaml) whose file name carries the
    local send date 2026-09-20 or 2026-10-08, including replies, wrong-list mails and late
    sends. Fixed before labelling, from the public scenario dates (generated/README.md §6).
  dates: ["2026-09-20", "2026-10-08"]

