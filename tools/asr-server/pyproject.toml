[project]
name = "asr-server"
version = "0.1.0"
description = "ASR-01: OpenAI-compatible transcription server on Apple Silicon (mlx-whisper)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.161.0",
    "mlx-whisper",
    "python-multipart",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
# MLX runs only on Apple Silicon: resolve the lockfile for that platform alone.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100
target-version = "py312"
